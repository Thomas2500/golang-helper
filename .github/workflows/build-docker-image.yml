name: Build golang-helper Image

on:
  push:
    paths:
      - '**'
  schedule:
    - cron: '5 0 */15 * *'
  workflow_dispatch:

# Build docker image for golang latest, 1.27, 1.26, 1.25

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        GO_VERSION: ["alpine", "1.27-alpine", "1.26-alpine", "1.25-alpine"]
        include:
          - GO_VERSION: "alpine"
            output_image: "thomas2500/golang-helper:latest"
          - GO_VERSION: "1.27-alpine"
            output_image: "thomas2500/golang-helper:1.27"
          - GO_VERSION: "1.26-alpine"
            output_image: "thomas2500/golang-helper:1.26"
          - GO_VERSION: "1.25-alpine"
            output_image: "thomas2500/golang-helper:1.25"
    name: Build golang-helper Image
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: docker_build
        with:
          context: .
          push: true
          tags: ${{ matrix.output_image }}
          build-args: |
            GO_VERSION=${{ matrix.GO_VERSION }}
